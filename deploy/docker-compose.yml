services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ayaka
      POSTGRES_PASSWORD: ayaka
      POSTGRES_DB: ayaka
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ayaka:ayaka@db:5432/ayaka
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
